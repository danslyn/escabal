<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="sending.css">
</head>
<body>

<h1 class="title">With grateful hearts and joyful smiles, <br> we invite you to join us in celebrating <br> Uno’s Dedication and 1st Birthday.
</h1>
<form id="rsvpForm"
      action=""
      class="form"
      method="POST">
<p class="tara">Ano tara? Tara! </p>
    <input
        type="text"
        name="name"
        placeholder="Your Name"
        required
    >

    <div class="attendance-buttons">

        <button
            type="button"
            class="rsvp-button"
            data-attendance="YES">
            YES
        </button>

        <button
            type="button"
            class="rsvp-button"
            data-attendance="NO">
            NO
        </button>

    </div>

    <input
        type="hidden"
        name="attendance"
        id="attendance"
    >

</form>

<div id="sendingPopup" class="sending-popup">

    <div class="sending-box">

        <div class="loader"></div>

        <h3>Sending...</h3>

        <p>
            Please wait while we record your response.
        </p>

    </div>

</div>

<script src="email.js"></script>
  
</body>
</html>
