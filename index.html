<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="sending.css">
</head>
<body>


<div id="darkOverlay"></div>


<div class="invitation-text">
    With grateful hearts and joyful smiles,<br>
    we invite you to join us in celebrating<br>
    <h2>Uno’s Dedication and 1st Birthday.</h2>
</div>

<form id="rsvpForm"
      action=""
      class="form"
      method="POST">
<p class="tara">Ano tara? Tara! </p>
    <input
        type="text"
        id="name"
        name="name"
        placeholder="Ano uli Name mo?"
        required
    >

    <div class="attendance-buttons">

        <button
            type="button"
            class="rsvp-button"
            data-attendance="YES">
            YES
        </button>

        <button
        id="noButton"
            type="button"
            class="rsvp-button"
            data-attendance="NO">
            NO
        </button>

    </div>

    <input
        type="hidden"
        name="attendance"
        id="attendance"
    >

</form>

<div id="sendingPopup" class="sending-popup">

    <div class="sending-box">

        <div class="loader"></div>

        <h3>Saglit..</h3>

        <p>
            SS ko lang, para laka takas.
        </p>

    </div>

</div>

<div id="errorPopup" class="error-popup">
    <div class="error-popup-box">
        <h2>Oops! 😅</h2>
        <p id="errorMessage">Ngek, hindi nag-send. Ulitin mo!</p>
        <button id="errorOkButton">OK</button>
    </div>
</div>

<script src="email.js"></script>
  
</body>
</html>
